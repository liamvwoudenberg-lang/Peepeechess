; Export presets used ONLY by tools/package/build_pc.sh (copied into a staging project; the repository's
; godot/ directory is not modified). "include_filter" packs raw files the combat code reads at runtime
; (audio manifest + WAVs, arena light sidecar, stats JSON) because imported-only packing would drop them.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json,*.wav"
exclude_filter=""
export_path=""
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
application/icon=""
application/product_name="Peepeechess Combat"
application/file_description="Peepeechess combat test build"
application/company_name=""

