# Example for Fly.io: `cd tools/relay && fly launch --copy-config --no-deploy` then `fly deploy`. Fly terminates TLS: the game address is
# wss://<app>.fly.dev . (Fly's free allowance changes: check the current pricing before deploying.)
app = "peepeechess-relay"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  TRUST_PROXY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "3s"
    grace_period = "5s"
    method = "GET"
    path = "/healthz"
